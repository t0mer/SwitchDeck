services:
  switchdeck:
    image: techblog/switchdeck:latest
    # With network_mode: host, the service listens directly on the host port (8080)
    # Explicit ports mapping is ignored with network_mode: host
    volumes:
      - switchdeck-data:/data/switchdeck
    environment:
      LOG_LEVEL: info
    restart: unless-stopped
    network_mode: host

volumes:
  switchdeck-data:
