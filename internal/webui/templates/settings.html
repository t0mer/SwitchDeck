{{define "content"}}
<div class="page-header">
  <div>
    <div class="page-title">Settings</div>
    <div class="page-subtitle">Application configuration</div>
  </div>
</div>

<div class="page-content">
  <form id="settings-form" style="max-width:600px">
    <div class="settings-section">
      <div class="settings-section-header">Authentication</div>
      <div class="settings-section-body">
        <div class="form-group">
          <label class="toggle-wrap">
            <label class="toggle">
              <input id="s-auth-enabled" type="checkbox">
              <span class="toggle-track"></span>
            </label>
            Require API token for all requests
          </label>
          <div class="form-hint">When enabled, all API and UI requests must include the token via <code>X-API-Token</code> header.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="s-auth-token">API Token</label>
          <div class="flex gap-2">
            <input id="s-auth-token" class="form-control" type="password" placeholder="Enter or generate a token">
            <button type="button" class="btn btn-secondary" id="btn-gen-token">Generate</button>
          </div>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{{end}}
