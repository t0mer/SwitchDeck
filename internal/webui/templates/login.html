<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwitchDeck — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>(function(){var t=localStorage.getItem('sd-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
  <style>
    .login-page{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      background:var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 50%,rgba(0,229,160,.04) 0%,transparent 55%),
        radial-gradient(ellipse at 80% 20%,rgba(77,166,255,.03) 0%,transparent 55%);
    }
    .login-card{
      width:100%;max-width:360px;
      background:var(--surface);
      border:1px solid var(--border-2);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-lg);
      padding:32px;
    }
    .login-logo{
      display:flex;align-items:center;gap:10px;
      margin-bottom:28px;
    }
    .login-logo svg{color:var(--accent)}
    .login-logo-text{
      font-size:18px;font-weight:700;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .login-title{
      font-size:22px;font-weight:700;
      color:var(--text-bright);
      letter-spacing:-.4px;
      margin-bottom:6px;
    }
    .login-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:24px}
    #login-error{margin-bottom:16px;display:none}
    .login-submit{width:100%;justify-content:center;padding:10px;font-size:14px}
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
        <circle cx="6" cy="6" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="18" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="login-logo-text">SwitchDeck</span>
    </div>
    <div class="login-title">Sign in</div>
    <div class="login-subtitle">Enter your credentials to continue</div>

    <div id="login-error" class="alert alert-danger"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="l-username">Username</label>
        <input id="l-username" class="form-control" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="l-password">Password</label>
        <input id="l-password" class="form-control" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary login-submit">Sign in</button>
    </form>
  </div>
</div>

<script>
(function() {
  var form   = document.getElementById('login-form');
  var errEl  = document.getElementById('login-error');
  var next   = new URLSearchParams(location.search).get('next') || '/';

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.style.display = 'none';
    var btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      var res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('l-username').value,
          password: document.getElementById('l-password').value,
        }),
      });
      if (res.ok) {
        window.location.href = next;
      } else {
        var data = await res.json().catch(function(){ return {}; });
        errEl.textContent = data.error || 'Invalid credentials';
        errEl.style.display = 'block';
      }
    } catch(err) {
      errEl.textContent = 'Network error. Please try again.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
