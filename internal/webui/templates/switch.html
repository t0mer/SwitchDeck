{{define "content"}}
<div class="page-header">
  <div class="page-header-left">
    <a href="/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Switches
    </a>
    <div>
      <div class="page-title" id="sw-name">Loading…</div>
    </div>
    <div id="sw-status"></div>
  </div>
  <div class="btn-actions">
    <button id="btn-collect" class="btn btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.32"/>
      </svg>
      Collect Now
    </button>
    <button id="btn-reboot" class="btn btn-danger">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18.36 6.64A9 9 0 1 1 5.64 5.64"/>
        <line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
      Reboot
    </button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn" data-tab="system">System</button>
  <button class="tab-btn" data-tab="ports">Ports</button>
  <button class="tab-btn" data-tab="stats">Statistics</button>
  <button class="tab-btn" data-tab="vlans">VLANs</button>
</div>

<div id="switch-detail" data-switch-id="{{.SwitchID}}" class="page-content">
  <div id="tab-system"  class="tab-panel"></div>
  <div id="tab-ports"   class="tab-panel"></div>
  <div id="tab-stats"   class="tab-panel"></div>
  <div id="tab-vlans"   class="tab-panel"></div>
</div>
{{end}}
