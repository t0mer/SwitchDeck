{{define "content"}}
<div class="page-header">
  <div>
    <div class="page-title">Dashboard</div>
    <div class="page-subtitle">All managed switches</div>
  </div>
  <button id="btn-add-switch" class="btn btn-primary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Switch
  </button>
</div>

<div class="page-content">
  <div id="switches-grid" class="switches-grid"></div>
</div>

<!-- Add / Edit Switch modal -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Switch</span>
      <button class="modal-close" id="btn-close-modal" aria-label="Close">&times;</button>
    </div>
    <form id="switch-form">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="f-name">Name</label>
          <input id="f-name" class="form-control" type="text" placeholder="Core Switch 1" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-ip">IP / Hostname</label>
            <input id="f-ip" class="form-control" type="text" placeholder="192.168.0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-username">Username</label>
            <input id="f-username" class="form-control" type="text" placeholder="admin" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-password">Password</label>
          <input id="f-password" class="form-control" type="password" placeholder="Leave blank to keep existing">
          <div class="form-hint hidden" id="modal-pwd-hint">Leave blank to keep the current password.</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-poll-stats">Stats Poll (sec)</label>
            <input id="f-poll-stats" class="form-control" type="number" min="10" value="60">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-poll-config">Config Poll (sec)</label>
            <input id="f-poll-config" class="form-control" type="number" min="30" value="300">
          </div>
        </div>
        <div class="form-group">
          <label class="toggle-wrap">
            <label class="toggle">
              <input id="f-insecure" type="checkbox">
              <span class="toggle-track"></span>
            </label>
            Allow self-signed TLS certificate
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Switch</button>
      </div>
    </form>
  </div>
</div>
{{end}}
